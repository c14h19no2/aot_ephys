task:
  name: aot_ephys
  memory_variant: main_memory_mainexp_complete
protocol:
  approved_for_acquisition: false
  video_initial_fixation_s: 5
  video_final_fixation_s: 5
  video_pre_fixation_s: 1.0
  video_duration_s: 2.5
  video_post_fixation_s: 0.1
input:
  instruction_continue_key: space
  memory_yes_key: j
  memory_no_key: k
  quit_key: q
input_device_index: -1
display:
  screen_index: 0
  resolution_px: [1920, 1080]
  expected_refresh_hz: 60
  refresh_tolerance_hz: 2
  full_screen: true
  skip_sync_tests: false
  # Visible width and height of the stimulus screen in cm, measured on the
  # screen. Set it in the site file; null leaves the viewing distance unknown.
  screen_size_cm: null
  # Acquisition precondition checked when the initial fixation ends: the minimum
  # fraction of its fixed-grid refresh slots that were actually presented. A
  # lower value stops the run before the first trial; null disables the check.
  refresh_guard_min_fraction: 0.9
  # Video task. true (default): fixation is refreshed every frame up to each
  # WAV-marked onset, so the display pipeline is in the same state at every
  # onset. false: each onset frame is drawn early and held until its timed
  # Flip. A site file can override this. See docs/trigger_timing.md.
  steady_flip: true
stimulus:
  # Legacy compatibility field; fitting now uses the full window and source size.
  movie_canvas_px: [1536, 1080]
  # 1 fits to the full window; smaller values add centered margins.
  movie_scale: 1
  # Intended visual angle of the fitted movie, width and height in degrees.
  # With display.screen_size_cm set, the run dialog shows the eye-to-screen
  # distance that gives this size.
  target_size_deg: [14.42, 8.14]
  background_rgb255: [128, 128, 128]
  # Original Python fixation, in degrees of visual angle (docs/configuration.md).
  # Pixel sizes follow from target_size_deg: at the suggested viewing distance
  # each element keeps this angle on any screen (ephys.fixationGeometry).
  fixation:
    # Gray disc behind the dot; its opacity falls off as a raised cosine over
    # the outer surround_fringe of its radius.
    surround_diameter_deg: 0.18270
    surround_fringe: 0.3
    # Black dot, drawn on top. outline_width_deg adds a white outline centred
    # on its edge (the written specification gives 0.00788); 0 leaves it out.
    dot_diameter_deg: 0.03654
    outline_width_deg: 0
    # Two white lines at 45 and 135 degrees through the centre, drawn before
    # the dot (lines drawn over a dot this small would hide its black).
    line_width_deg: 0.00788
    line_rgb255: [255, 255, 255]
    outline_rgb255: [255, 255, 255]
    dot_rgb255: [0, 0, 0]
    surround_rgb255: [128, 128, 128]
instructions:
  video: Please keep fixating at the center.
  memory: Please press J for a picture seen in the videos, or K for a picture not seen.
  text_height_px: 23
markers:
  # Video events output analog WAV pulses; event names identify them in the log.
  backend: wav
  # Memory events remain software-only until a separate waveform protocol is defined.
  memory_backend: dummy
  video_offset_enabled: false
  fixation_onset_enabled: false
  memory_onset_enabled: true
  run_boundary_enabled: true
  blank_enabled: true
  waveforms:
    # Scheduled with the first run-start Flip after Space, before the initial baseline.
    run_start: TrigP08.wav
    # Normal completion and Q abort share this waveform; the log stores run status.
    run_end: TrigN08.wav
    # Source frame 0 and blank onset share this waveform; identity stays in the log.
    video_onset: TrigP16.wav
    # Reserved for optional video/blank offset output, disabled by default.
    video_offset: TrigN16.wav
  wav:
    # Relative paths resolve from the aot_ephys project folder.
    directory: assets/triggers
    # null selects the system default output; an index selects a specific device.
    device_index: null
    # If nonempty, the selected device name must match exactly.
    device_name: ''
    # The original 100 samples are played directly at 48000 Hz without resampling.
    sample_rate_hz: 48000
    channels: 2
    # One-based audio output: 1 = left, 2 = right. The other channel is silent.
    output_channel: 2
    gain: 0.5
    latency_class: 2
    # Target scheduling lead; shortfalls are logged without aborting the run.
    minimum_lead_s: 0.100
    minimum_low_s: 0.010
    completion_timeout_s: 2
    # Trial QC flags offsets more than this from the run's median offset;
    # also the reporting reference. Exceeding it never aborts the run.
    max_sync_error_s: 0.002
# A square drawn into the stimulus image for a light sensor: on_rgb255 while a
# movie is shown (onset to offset Flip), off_rgb255 at all other times. Set it
# per site; see docs/configuration.md.
photodiode:
  enabled: false
  # Required with enabled: the site accepts the visible square, including any
  # part of the movie it covers (a corner of a full-window movie).
  approved_placement: false
  # Also on for one refresh at the start of each pre-fixation (trial start).
  fixation_onset_enabled: false
  # [left, top, right, bottom] in window pixels, inside the window, e.g.
  # [0, 0, 60, 60]. Top rows are scanned out first, so keep one position.
  rect_px: null
  on_rgb255: [255, 255, 255]
  off_rgb255: [0, 0, 0]
eyelink:
  enabled: false
  address: '100.1.1.1'
  calibration_type: HV13
  calibration_area_proportion: '0.4 0.4'
  validation_area_proportion: '0.4 0.4'
  sample_rate_hz: 1000
paths:
  video_root: ''
  picture_root: ''
  output_root: ''
playback:
  backend: native
  # Offline preparation and the legacy frames backend only; native runs ignore these.
  ffmpeg_path: ''
  ffprobe_path: ''
  python_path: ''
  # Required for native video playback/preparation. Set the folder in the site YAML.
  # Empty, null or none values cause an error; no implicit directory is used.
  native_media_root: null
  native_buffer_s: 3
  # Hard timeout only when no drawable first frame is available.
  # Missing a fixation/loading deadline is recorded and does not abort.
  native_prepare_timeout_s: 5
  native_disable_hw_decode: false
  startup_preload_movies: 2
  max_texture_bytes: 1073741824
logging:
  # Preflight allocation ceilings; runtime buffers grow if their estimate is exceeded.
  max_flips: 250000
  max_events: 50000
  max_markers: 10000
