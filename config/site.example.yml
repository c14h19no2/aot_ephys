protocol:
  approved_for_acquisition: false
playback:
  # Set an explicit native-copy directory before running the video task.
  native_media_root: null
display:
  screen_index: 1
  resolution_px: [1920, 1080]
  expected_refresh_hz: 120
  full_screen: true
  skip_sync_tests: false
  # Visible picture area in cm [width, height]; the run dialog then shows the
  # viewing distance for stimulus.target_size_deg.
  screen_size_cm: null
paths:
  video_root: ''
  picture_root: ''
  output_root: ''
markers:
  wav:
    # One-based stereo output: 1 = left, 2 = right.
    output_channel: 2
    # null uses the system default audio output; set an index to select a device.
    device_index: null
    # A nonempty name is checked against the selected device before presentation.
    device_name: ''
